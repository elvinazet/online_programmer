services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-online_programmer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-online_programmer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  api:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  # Celery worker: проверка сабмитов (judge) + опрос Codeforces.
  # ВАЖНО: для judge через Docker нужно собрать sandbox-образы заранее:
  #   bash backend/sandbox/build.sh
  # Воркеру проброшен docker.sock — он запускает эфемерные sandbox-контейнеры.
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    command: celery -A app.workers.celery_app:celery_app worker --loglevel=info
    env_file: .env
    environment:
      JUDGE_BACKEND: docker
      JUDGE_INLINE: "false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Celery beat: расписание (опрос CF каждые 5 минут).
  beat:
    build: ./backend
    command: celery -A app.workers.celery_app:celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy

  # Next.js. Собирается с NEXT_PUBLIC_API_URL="" → запросы к /api идут на тот
  # же origin (через nginx).
  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ""
    depends_on:
      - api

  # Единая точка входа (и место терминации TLS в проде).
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api
      - frontend

volumes:
  pgdata:
